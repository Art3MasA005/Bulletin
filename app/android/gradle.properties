org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off on this project because every plugin
# module fails on Windows with "Could not close incremental caches ...
# class-fq-name-to-source.tab" -- the cache files stay locked (antivirus or the
# Kotlin daemon holding handles) and the build dies before any of our code is
# compiled. Full compilation of the plugin modules costs seconds; the failure
# costs the whole build.
kotlin.incremental=false
